version: 1.2.0
repository: https://github.com/MkhytarMkhoian/herald-flutter/tree/main/packages/herald_meta
issue_tracker: https://github.com/MkhytarMkhoian/herald-flutter/issues
documentation: https://mkhytarmkhoian.github.io/herald-docs/sdks/flutter/
topics: [analytics, meta, facebook, attribution, tracking]

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  facebook_app_events: ^0.31.0
  flutter:
    sdk: flutter
  herald: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
