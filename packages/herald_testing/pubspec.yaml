name: herald_testing
description: >-
  A fake Herald vendor that records every event, property and call, with
  assertions for tests in apps that use Herald.
version: 1.0.0-dev.1
homepage: https://mkhytarmkhoian.github.io/herald/guides/testing/
repository: https://github.com/MkhytarMkhoian/herald-flutter/tree/main/packages/herald_testing
issue_tracker: https://github.com/MkhytarMkhoian/herald-flutter/issues
documentation: https://mkhytarmkhoian.github.io/herald/guides/testing/
topics: [analytics, testing]

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  herald: ^1.0.0-dev.1
  test_api: '>=0.7.0 <0.8.0'

dev_dependencies:
  test: ^1.26.0
